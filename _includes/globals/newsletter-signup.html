<!-- ======== Newsletter Subscription Banner (Ubicación: Después de Últimas Noticias - Formato Compacto) ======== -->
<div class="container my-3 my-lg-4">
  <div class="card border-0 shadow-sm text-white" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 8px; overflow: hidden; border-left: 4px solid #c82333 !important;">
    <div class="card-body py-2 px-3 py-md-3 px-md-4">
      <div class="row align-items-center">
        <!-- Columna Izquierda: Información compacta tipo Banner -->
        <div class="col-12 col-lg-4 mb-2 mb-lg-0">
          <div class="d-flex align-items-center mb-1">
            <span class="badge badge-danger text-uppercase px-2 py-0 mr-2" style="font-size: 10px; letter-spacing: 0.5px; background-color: #c82333; line-height: 18px;">
              <i class="fa fa-envelope-open-o mr-1"></i> Boletín B2B
            </span>
            <small class="text-muted" style="color: #94a3b8 !important; font-size: 11px;">Semanal &bull; Sin costo</small>
          </div>
          <h4 class="text-white font-weight-bold mb-0" style="font-size: 16px; line-height: 1.25;">
            Boletín ITNEWS {{ page.filterCategory | default: "LatAm" }}
          </h4>
          <p class="text-muted mb-0 d-none d-xl-block" style="color: #94a3b8 !important; font-size: 11.5px; line-height: 1.3; margin-top: 2px;">
            Análisis, telecomunicaciones y tecnología en tu correo.
          </p>
        </div>

        <!-- Columna Derecha: Formulario Horizontal Compacto -->
        <div class="col-12 col-lg-8">
          <form id="portalNewsletterForm_{{ page.filterCategory | slugify | default: 'latam' }}" class="portal-newsletter-form m-0">
            <input type="hidden" name="pais" value="{{ page.filterCategory | default: 'LatAm' }}">
            <div class="form-row align-items-center">
              <div class="col-6 col-md-3 mb-1 mb-md-0">
                <input type="text" name="nombre" class="form-control form-control-sm" placeholder="Nombre *" required style="background: #090d16; border: 1px solid #334155; color: #fff; border-radius: 4px; padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
              <div class="col-6 col-md-3 mb-1 mb-md-0">
                <input type="text" name="apellido" class="form-control form-control-sm" placeholder="Apellido *" required style="background: #090d16; border: 1px solid #334155; color: #fff; border-radius: 4px; padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
              <div class="col-6 col-md-3 mb-1 mb-md-0">
                <input type="text" name="empresa" class="form-control form-control-sm" placeholder="Empresa *" required style="background: #090d16; border: 1px solid #334155; color: #fff; border-radius: 4px; padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
              <div class="col-6 col-md-3 mb-1 mb-md-0">
                <input type="email" name="email" class="form-control form-control-sm" placeholder="Correo corporativo *" required style="background: #090d16; border: 1px solid #334155; color: #fff; border-radius: 4px; padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2 pt-1 border-top" style="border-color: rgba(255,255,255,0.07) !important;">
              <span style="color: #64748b; font-size: 10.5px;">
                <i class="fa fa-lock mr-1"></i> Datos protegidos. Cero spam.
              </span>
              <button type="submit" class="btn btn-danger btn-sm font-weight-bold px-3 py-1" style="background-color: #c82333; border: none; border-radius: 4px; font-size: 12px; height: 28px; line-height: 18px; cursor: pointer;">
                <span>Suscribirme</span> <i class="fa fa-paper-plane ml-1"></i>
              </button>
            </div>
            <div class="portal-newsletter-feedback mt-1" style="display: none; font-size: 11.5px; border-radius: 4px; padding: 4px 8px;"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var formId = "portalNewsletterForm_{{ page.filterCategory | slugify | default: 'latam' }}";
  var form = document.getElementById(formId);
  if (!form || form.dataset.bound) return;
  form.dataset.bound = "true";

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var submitBtn = form.querySelector('button[type="submit"]');
    var feedback = form.querySelector('.portal-newsletter-feedback');
    var nombre = (form.querySelector('input[name="nombre"]').value || '').trim();
    var apellido = (form.querySelector('input[name="apellido"]').value || '').trim();
    var empresa = (form.querySelector('input[name="empresa"]').value || '').trim();
    var email = (form.querySelector('input[name="email"]').value || '').trim();
    var pais = (form.querySelector('input[name="pais"]').value || '{{ page.filterCategory | default: "LatAm" }}').trim();

    if (!nombre || !apellido || !empresa || !email) {
      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.background = '#fef2f2';
        feedback.style.color = '#991b1b';
        feedback.textContent = 'Por favor completa todos los campos requeridos.';
      }
      return;
    }

    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i> Guardando...';
    }

    var payload = {
      nombre: nombre,
      apellido: apellido,
      empresa: empresa,
      email: email,
      pais: pais,
      fecha: new Date().toISOString()
    };

    // 1. Google Sheets Webhook
    var sheetsUrl = 'https://script.google.com/macros/s/AKfycbwDr5Z55vzDxwF_7QENtPpb6Yapbx_XoWQiBdPvaEcLEMM9a2wjiACymozyu59blL1_jQ/exec';
    var pSheets = fetch(sheetsUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function(err){ console.warn(err); });

    // 2. FormSubmit notificación por correo
    var pMail = fetch('https://formsubmit.co/ajax/edgar@itnews.lat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: 'Nueva suscripción boletín ITNEWS ' + pais + ': ' + nombre + ' ' + apellido,
        _template: 'table',
        _captcha: 'false',
        Nombre: nombre,
        Apellido: apellido,
        Empresa: empresa,
        Email: email,
        Pais: pais,
        Fecha: new Date().toLocaleString('es-LA')
      })
    }).catch(function(err){ console.warn(err); });

    Promise.all([pSheets, pMail]).then(function() {
      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.background = '#f0fdf4';
        feedback.style.color = '#166534';
        feedback.textContent = '¡Gracias por suscribirte, ' + nombre + '! Tus datos han sido registrados con éxito.';
      }
      form.reset();
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>¡Suscrito!</span> <i class="fa fa-check ml-1"></i>';
        setTimeout(function() {
          submitBtn.innerHTML = '<span>Suscribirme</span> <i class="fa fa-paper-plane ml-1"></i>';
        }, 4000);
      }
    });
  });
})();
</script>
